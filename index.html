<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nekostream API - Admin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0f1117;
            color: #e6e6e6;
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        .hidden {
            display: none !important;
        }

        /* LOGIN */

        .login-wrapper {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 380px;

            background: #171a22;

            border: 1px solid #252a35;
            border-radius: 10px;

            padding: 25px;
        }

        .login-box h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .login-box p {
            color: #8f96a3;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;

            color: #aeb4c0;

            font-size: 13px;

            margin-bottom: 7px;
        }

        .input {
            width: 100%;
            height: 43px;

            padding: 0 12px;

            background: #0f1117;

            border: 1px solid #303644;
            border-radius: 7px;

            color: #fff;

            outline: none;

            font-size: 14px;
        }

        .input:focus {
            border-color: #667085;
        }

        .login-button {
            width: 100%;
            height: 42px;

            margin-top: 5px;

            border: 0;
            border-radius: 7px;

            background: #fff;
            color: #111;

            cursor: pointer;

            font-size: 14px;
            font-weight: 600;
        }

        .login-error {
            color: #f97066;

            font-size: 13px;

            margin-top: 12px;

            text-align: center;

            min-height: 18px;
        }


        /* ADMIN */

        .container {
            width: min(1100px, 92%);

            margin: auto;

            padding: 35px 0 50px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header-top {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }

        .header h1 {
            font-size: 28px;

            margin-bottom: 8px;
        }

        .header p {
            color: #8f96a3;

            font-size: 14px;
        }

        .logout {
            height: 36px;

            padding: 0 13px;

            background: #252a35;

            border: 0;
            border-radius: 7px;

            color: #fff;

            cursor: pointer;

            font-size: 13px;
        }


        /* STATUS */

        .status {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-top: 18px;

            padding: 12px 15px;

            background: #171a22;

            border: 1px solid #252a35;
            border-radius: 8px;

            font-size: 14px;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #777;
        }

        .status-dot.online {
            background: #32d583;
        }

        .status-dot.offline {
            background: #f04438;
        }


        /* SOURCES */

        .sources {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }

        .card {
            background: #171a22;

            border: 1px solid #252a35;
            border-radius: 10px;

            padding: 20px;
        }

        .card h2 {
            font-size: 18px;

            margin-bottom: 5px;
        }

        .source-name {
            color: #8f96a3;

            font-size: 13px;

            margin-bottom: 18px;
        }

        .label {
            display: block;

            color: #aeb4c0;

            font-size: 13px;

            margin-bottom: 7px;
        }

        .buttons {
            display: flex;

            gap: 8px;

            margin-top: 12px;
        }

        button {
            height: 38px;

            padding: 0 14px;

            border: 0;
            border-radius: 7px;

            cursor: pointer;

            font-size: 13px;
            font-weight: 600;
        }

        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        .btn-save {
            background: #fff;
            color: #111;
        }

        .btn-test {
            background: #252a35;
            color: #fff;
        }

        .btn-refresh {
            background: #252a35;
            color: #fff;
        }

        .btn-restart {
            background: #f04438;
            color: #fff;
        }


        /* ACTIONS */

        .actions {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #252a35;
        }


        /* MESSAGE */

        .message {
            position: fixed;

            right: 20px;
            bottom: 20px;

            max-width: 350px;

            padding: 13px 16px;

            border-radius: 8px;

            background: #252a35;

            border: 1px solid #303644;

            color: #fff;

            font-size: 14px;

            display: none;

            z-index: 999;
        }

        .message.show {
            display: block;
        }

        .message.success {
            border-color: #32d583;
        }

        .message.error {
            border-color: #f04438;
        }


        /* MOBILE */

        @media (max-width: 750px) {
            .sources {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;

                align-items: stretch;

                gap: 10px;
            }

            .btn-restart {
                width: 100%;
            }

            .header-top {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN -->

    <div
        id="loginPage"
        class="login-wrapper"
    >

        <div class="login-box">

            <h1>
                Wajik Anime API
            </h1>

            <p>
                Login untuk mengakses Admin Panel
            </p>

            <form id="loginForm">

                <div class="field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        class="input"
                        type="text"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        class="input"
                        type="password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    id="loginButton"
                    class="login-button"
                    type="submit"
                >
                    Login
                </button>


                <div
                    id="loginError"
                    class="login-error"
                ></div>

            </form>

        </div>

    </div>


    <!-- ADMIN -->

    <div
        id="adminPage"
        class="container hidden"
    >

        <div class="header">

            <div class="header-top">

                <div>

                    <h1>
                        Wajik Anime API
                    </h1>

                    <p>
                        Admin Panel — Source Base URL
                    </p>

                </div>


                <button
                    class="logout"
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>


            <div class="status">

                <span
                    id="statusDot"
                    class="status-dot"
                ></span>

                <span id="statusText">
                    Checking API...
                </span>

            </div>

        </div>


        <div
            id="sources"
            class="sources"
        >

            <!-- OTAKUDESU -->

            <div class="card">

                <h2>
                    Otakudesu
                </h2>

                <div class="source-name">
                    otakudesu.config
                </div>

                <label
                    class="label"
                    for="otakudesu-url"
                >
                    Base URL
                </label>

                <input
                    id="otakudesu-url"
                    class="input"
                    type="url"
                    autocomplete="off"
                >

                <div class="buttons">

                    <button
                        class="btn-test"
                        onclick="testSource('otakudesu')"
                    >
                        Test
                    </button>

                    <button
                        class="btn-save"
                        onclick="saveSource('otakudesu')"
                    >
                        Save
                    </button>

                </div>

            </div>


            <!-- KURAMANIME -->

            <div class="card">

                <h2>
                    Kuramanime
                </h2>

                <div class="source-name">
                    kuramanime.config
                </div>

                <label
                    class="label"
                    for="kuramanime-url"
                >
                    Base URL
                </label>

                <input
                    id="kuramanime-url"
                    class="input"
                    type="url"
                    autocomplete="off"
                >

                <div class="buttons">

                    <button
                        class="btn-test"
                        onclick="testSource('kuramanime')"
                    >
                        Test
                    </button>

                    <button
                        class="btn-save"
                        onclick="saveSource('kuramanime')"
                    >
                        Save
                    </button>

                </div>

            </div>


            <!-- OPLOVERZ -->

            <div class="card">

                <h2>
                    Oploverz
                </h2>

                <div class="source-name">
                    oploverz.config
                </div>

                <label
                    class="label"
                    for="oploverz-url"
                >
                    Base URL
                </label>

                <input
                    id="oploverz-url"
                    class="input"
                    type="url"
                    autocomplete="off"
                >

                <div class="buttons">

                    <button
                        class="btn-test"
                        onclick="testSource('oploverz')"
                    >
                        Test
                    </button>

                    <button
                        class="btn-save"
                        onclick="saveSource('oploverz')"
                    >
                        Save
                    </button>

                </div>

            </div>


            <!-- SAMEHADAKU -->

            <div class="card">

                <h2>
                    Samehadaku
                </h2>

                <div class="source-name">
                    samehadaku.config
                </div>

                <label
                    class="label"
                    for="samehadaku-url"
                >
                    Base URL
                </label>

                <input
                    id="samehadaku-url"
                    class="input"
                    type="url"
                    autocomplete="off"
                >

                <div class="buttons">

                    <button
                        class="btn-test"
                        onclick="testSource('samehadaku')"
                    >
                        Test
                    </button>

                    <button
                        class="btn-save"
                        onclick="saveSource('samehadaku')"
                    >
                        Save
                    </button>

                </div>

            </div>

        </div>


        <div class="actions">

            <button
                class="btn-refresh"
                onclick="loadSources()"
            >
                Refresh
            </button>

            <button
                class="btn-restart"
                onclick="restartApi()"
            >
                Restart API
            </button>

        </div>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <script>
        const API = "/admin";


        function showMessage(
            text,
            type = "success"
        ) {
            const message =
                document.getElementById(
                    "message"
                );

            message.textContent = text;

            message.className =
                `message show ${type}`;

            clearTimeout(
                window.messageTimer
            );

            window.messageTimer =
                setTimeout(() => {
                    message.className =
                        "message";
                }, 3000);
        }


        function setLoading(
            loading
        ) {
            document
                .querySelectorAll("button")
                .forEach(button => {
                    button.disabled =
                        loading;
                });
        }


        function setApiStatus(
            online,
            text
        ) {
            const dot =
                document.getElementById(
                    "statusDot"
                );

            const statusText =
                document.getElementById(
                    "statusText"
                );

            dot.className =
                "status-dot " +
                (
                    online
                        ? "online"
                        : "offline"
                );

            statusText.textContent =
                text;
        }


        function showLogin() {
            document
                .getElementById(
                    "loginPage"
                )
                .classList.remove(
                    "hidden"
                );

            document
                .getElementById(
                    "adminPage"
                )
                .classList.add(
                    "hidden"
                );
        }


        function showAdmin() {
            document
                .getElementById(
                    "loginPage"
                )
                .classList.add(
                    "hidden"
                );

            document
                .getElementById(
                    "adminPage"
                )
                .classList.remove(
                    "hidden"
                );

            loadSources();
        }


        async function checkLogin() {
            try {
                const response =
                    await fetch(
                        `${API}/check`,
                        {
                            credentials:
                                "same-origin"
                        }
                    );

                if (!response.ok) {
                    showLogin();
                    return;
                }

                const data =
                    await response.json();

                if (data.loggedIn) {
                    showAdmin();
                } else {
                    showLogin();
                }

            } catch {
                showLogin();
            }
        }


        document
            .getElementById(
                "loginForm"
            )
            .addEventListener(
                "submit",
                async event => {
                    event.preventDefault();

                    const username =
                        document
                            .getElementById(
                                "username"
                            )
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById(
                                "password"
                            )
                            .value;

                    const error =
                        document
                            .getElementById(
                                "loginError"
                            );

                    const button =
                        document
                            .getElementById(
                                "loginButton"
                            );

                    error.textContent = "";

                    button.disabled = true;

                    button.textContent =
                        "Login...";

                    try {
                        const response =
                            await fetch(
                                `${API}/login`,
                                {
                                    method: "POST",

                                    credentials:
                                        "same-origin",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            username,
                                            password
                                        })
                                }
                            );

                        const data =
                            await response
                                .json()
                                .catch(
                                    () => ({})
                                );

                        if (!response.ok) {
                            throw new Error(
                                data.message ||
                                "Login gagal"
                            );
                        }

                        showAdmin();

                    } catch (error) {
                        error =
                            error;

                        document
                        .getElementById(
                                "loginError"
                            )
                            .textContent =
                            error.message ||
                            "Login gagal";

                    } finally {
                        button.disabled =
                            false;

                        button.textContent =
                            "Login";
                    }
                }
            );


        async function logout() {
            try {
                await fetch(
                    `${API}/logout`,
                    {
                        method: "POST",

                        credentials:
                            "same-origin"
                    }
                );
            } finally {
                showLogin();

                document
                    .getElementById(
                        "password"
                    )
                    .value = "";
            }
        }


        async function loadSources() {
            try {
                setApiStatus(
                    false,
                    "Loading sources..."
                );

                const response =
                    await fetch(
                        `${API}/sources`,
                        {
                            credentials:
                                "same-origin"
                        }
                    );

                if (response.status === 401) {
                    showLogin();
                    return;
                }

                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }

                const data =
                    await response.json();

                const sources =
                    data.sources || data;

                for (
                    const [
                        source,
                        config
                    ] of Object.entries(
                        sources
                    )
                ) {
                    const input =
                        document.getElementById(
                            `${source}-url`
                        );

                    if (!input) {
                        continue;
                    }

                    if (
                        typeof config ===
                        "string"
                    ) {
                        input.value =
                            config;

                    } else if (
                        config &&
                        config.baseUrl
                    ) {
                        input.value =
                            config.baseUrl;
                    }
                }

                setApiStatus(
                    true,
                    "API Online"
                );

            } catch (error) {
                console.error(error);

                setApiStatus(
                    false,
                    "Gagal mengambil konfigurasi"
                );

                showMessage(
                    "Gagal mengambil konfigurasi.",
                    "error"
                );
            }
        }


        async function saveSource(
            source
        ) {
            const input =
                document.getElementById(
                    `${source}-url`
                );

            if (!input) {
                return;
            }

            const baseUrl =
                input.value.trim();

            if (!baseUrl) {
                showMessage(
                    "Base URL tidak boleh kosong.",
                    "error"
                );

                return;
            }

            try {
                new URL(baseUrl);
            } catch {
                showMessage(
                    "Base URL tidak valid.",
                    "error"
                );

                return;
            }

            try {
                setLoading(true);

                const response =
                    await fetch(
                        `${API}/sources/${source}`,
                        {
                            method: "PUT",

                            credentials:
                                "same-origin",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    baseUrl
                                })
                        }
                    );

                if (response.status === 401) {
                    showLogin();
                    return;
                }

                const data =
                    await response
                        .json()
                        .catch(
                            () => ({})
                        );

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        `HTTP ${response.status}`
                    );
                }

                showMessage(
                    `${source} Base URL berhasil disimpan.`
                );

            } catch (error) {
                console.error(error);

                showMessage(
                    error.message ||
                    "Gagal menyimpan Base URL.",
                    "error"
                );

            } finally {
                setLoading(false);
            }
        }


        async function testSource(
            source
        ) {
            const input =
                document.getElementById(
                    `${source}-url`
                );

            if (!input) {
                return;
            }

            const baseUrl =
                input.value.trim();

            if (!baseUrl) {
                showMessage(
                    "Base URL tidak boleh kosong.",
                    "error"
                );

                return;
            }

            try {
                new URL(baseUrl);
            } catch {
                showMessage(
                    "Base URL tidak valid.",
                    "error"
                );

                return;
            }

            try {
                setLoading(true);

                const response =
                    await fetch(
                        `${API}/test-source`,
                        {
                            method: "POST",

                            credentials:
                                "same-origin",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    source,
                                    baseUrl
                                })
                        }
                    );

                if (response.status === 401) {
                    showLogin();
                    return;
                }

                const data =
                    await response
                        .json()
                        .catch(
                            () => ({})
                        );

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        `HTTP ${response.status}`
                    );
                }

                showMessage(
                    data.message ||
                    `${source} berhasil diakses.`
                );

            } catch (error) {
                console.error(error);

                showMessage(
                    error.message ||
                    `Gagal melakukan test ${source}.`,
                    "error"
                );

            } finally {
                setLoading(false);
            }
        }


        async function restartApi() {
            const confirmed =
                confirm(
                    "Restart API sekarang?\n\n" +
                    "API akan mati sebentar dan kembali " +
                    "hidup jika PM2 aktif."
                );

            if (!confirmed) {
                return;
            }

            try {
                setLoading(true);

                const response =
                    await fetch(
                        `${API}/restart`,
                        {
                            method: "POST",

                            credentials:
                                "same-origin"
                        }
                    );

                const data =
                    await response
                        .json()
                        .catch(
                            () => ({})
                        );

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        `HTTP ${response.status}`
                    );
                }

                showMessage(
                    "API sedang direstart..."
                );

                setApiStatus(
                    false,
                    "Restarting API..."
                );

            } catch (error) {
                console.error(error);

                showMessage(
                    error.message ||
                    "Gagal melakukan restart API.",
                    "error"
                );

                setLoading(false);
            }
        }


        window.addEventListener(
            "DOMContentLoaded",
            () => {
                checkLogin();
            }
        );
    </script>

</body>
</html>
